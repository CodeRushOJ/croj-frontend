name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set reproducible image metadata
        id: metadata
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: coderushoj/croj-frontend:ci
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}.git
            VCS_REF=${{ github.sha }}
            VERSION=0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root runtime contract
        env:
          CROJ_IMAGE_REVISION: ${{ github.sha }}
          CROJ_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}.git
          CROJ_IMAGE_VERSION: 0.1.0
          CROJ_SKIP_IMAGE_BUILD: "1"
        run: ./tests/container-contract.sh coderushoj/croj-frontend:ci
      - name: Build multi-architecture OCI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/croj-frontend.oci.tar
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}.git
            VCS_REF=${{ github.sha }}
            VERSION=0.1.0
          cache-from: type=gha

name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set reproducible image metadata
        id: metadata
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: coderushoj/croj-frontend:ci
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}.git
            VCS_REF=${{ github.sha }}
            VERSION=0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root runtime contract
        env:
          CROJ_IMAGE_REVISION: ${{ github.sha }}
          CROJ_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}.git
          CROJ_IMAGE_VERSION: 0.1.0
          CROJ_SKIP_IMAGE_BUILD: "1"
        run: ./tests/container-contract.sh coderushoj/croj-frontend:ci
      - name: Build multi-architecture OCI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/croj-frontend.oci.tar
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}.git
            VCS_REF=${{ github.sha }}
            VERSION=0.1.0
          cache-from: type=gha

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify annotated SemVer release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must match vX.Y.Z exactly."
            exit 1
          }

          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          tag_sha="$(jq -er 'select(.object.type == "tag") | .object.sha' <<<"$tag_ref")" || {
            echo "::error::Release tag must be annotated."
            exit 1
          }
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          jq -e '
            .object.type == "commit"
            and .object.sha == env.GITHUB_SHA
          ' <<<"$tag_object" >/dev/null || {
            echo "::error::Release tag must target this commit."
            exit 1
          }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set reproducible release metadata
        id: metadata
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build and push release image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/coderushoj/croj-frontend:${{ github.ref_name }}
            ghcr.io/coderushoj/croj-frontend:sha-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}.git
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest release image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/coderushoj/croj-frontend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write image artifact metadata
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "ghcr.io/coderushoj/croj-frontend" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg revision "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            '{repository:$repository,tag:$tag,revision:$revision,digest:$digest,platforms:["linux/amd64","linux/arm64"]}' \
            > image-artifact.json
      - name: Upload image artifact metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-artifact-${{ github.ref_name }}
          path: image-artifact.json
          if-no-files-found: error

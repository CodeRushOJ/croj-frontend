server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # croj-platform Gateway owns /api, including WebSocket Upgrade requests.
    # Fail closed if Gateway routing ever sends those requests here.
    location = /api {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # Local development proxies /uploads. The current platform does not expose
    # that prefix, so it must never fall through to the SPA shell in production.
    location = /uploads {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
    location ^~ /uploads/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

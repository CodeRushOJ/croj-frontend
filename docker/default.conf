server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Gateway API owns same-origin backend routing. If /api or /uploads is
    # accidentally sent to this Service, never turn it into the SPA shell.
    location = /api {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
    location = /uploads {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
    location ^~ /uploads/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
